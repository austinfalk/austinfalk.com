# Checks every pull request and every push to main. Cloudflare Workers Builds
# deploys; this only proves the change is safe to deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main always
# finish, so every merged commit is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Bun as everywhere else: the version pinned in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Astro's CLI runs on Node. Same version as Workers Builds: .node-version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Reuse resized photos between runs (Astro's image cache); they only
      # change when the source photos or image settings do. Saves about a minute.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/assets/**', 'src/components/ProfilePhoto.astro', 'src/layouts/BaseLayout.astro', 'bun.lock') }}
          restore-keys: astro-

      - run: bun install --frozen-lockfile
      # GitHub's dependency graph doesn't read bun.lock, so Dependabot alerts
      # miss transitive packages. The ignored advisory is `braces`, reached
      # only through the shadcn CLI (dev-only) and with no fixed release yet.
      - run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm
      - run: bun run check:public
      - run: bun run format:check
      - run: bun run check
      - run: bun run build
      # Starts wrangler dev on dist/ and checks redirects, status codes and headers.
      - run: bun run test:redirects
